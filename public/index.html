<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Content Security Policy. GitHub Pages can't send response headers, so the policy is set here.
        · scripts: only this site's own files — no inline script, no eval, no workers, no plugins
        · Trusted Types: DOM injection sinks are locked; only webpack's policy may produce script URLs
        · everything else: this site only (fonts are self-hosted), nothing may frame, post or connect elsewhere
      Styles allow inline because the style library (Emotion) and the 3D sign renderer set styles at runtime;
      no script can be injected through them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; child-src 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types webpack"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B121C" />
    <meta
      name="description"
      content="Jayprakash Behera — full stack developer for AI-powered products and secure systems. Available for freelance and contract work."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="canonical" href="https://jaypee-2003.github.io/jaypee/" />
    <!-- Link previews (LinkedIn, WhatsApp, Slack, X). og.jpg is rendered from the 3D scene by npm run stills. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jaypee" />
    <meta property="og:title" content="Jayprakash Behera — Full Stack Developer · AI & Security" />
    <meta
      property="og:description"
      content="AI-powered products and secure systems, from architecture to production. Available for freelance and contract work."
    />
    <meta property="og:url" content="https://jaypee-2003.github.io/jaypee/" />
    <meta property="og:image" content="https://jaypee-2003.github.io/jaypee/stills/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jayprakash Behera's name stencilled across shipping containers at a container terminal at night" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Jaypee</title>
    <style>
      html { background: #0B121C; }
      html[data-theme='day'] { background: #ECE7DC; }
    </style>
    <!-- Before first paint: frame protection and night/day (no inline script: the CSP forbids it) -->
    <script src="%PUBLIC_URL%/boot.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
