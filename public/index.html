<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B121C" />
    <meta
      name="description"
      content="Jayprakash Behera — Full Stack Developer available for freelance and contract work. SaaS platforms, backend systems and AI-powered applications."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Display: Big Shoulders Display · Body: Archivo (the 3D scene loads the stencil cut from @fontsource) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,400&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Jaypee</title>
    <style>
      html { background: #0B121C; }
      html[data-theme='day'] { background: #ECE7DC; }
    </style>
    <!-- Night or day, before first paint (src/site/timeOfDay.ts keeps it in sync afterwards) -->
    <script>
      try {
        var t = new URLSearchParams(location.search).get('time') || localStorage.getItem('jpb:time');
        if (t === 'day' || t === 'night') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
