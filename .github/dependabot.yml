# Weekly update pull requests for npm packages and for the pinned GitHub Actions (Dependabot updates the
# commit SHAs too). Security updates are raised as soon as an advisory is published, regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
