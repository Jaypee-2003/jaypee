# Builds the site on every push to main and publishes it to the gh-pages branch, which GitHub Pages
# serves at https://jaypee-2003.github.io/jaypee. Can also be run by hand from the Actions tab.
#
# Supply-chain hardening:
#   · every action is pinned to a full commit SHA (the tag is noted beside it); Dependabot keeps them current
#   · the token gets no permissions by default; only the deploy job may write, and only repository contents
#   · a high- or critical-severity advisory in any dependency the site ships stops the deploy
#
# The plain view's photographs are rendered here, on every deploy, from the build itself (see the step
# below), so they always match the content. The copies in public/stills are only for the README and for
# local previews.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer push supersedes a deploy that's still running
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Exact versions from the lockfile, nothing resolved at build time
      - run: npm ci

      # Only what ships to the browser; build tooling is audited by Dependabot instead
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # CI=true makes warnings fail the build, the same check as locally. `prebuild` runs the content check
      # (scripts/check-content.js) first: a project that wouldn't fit its sign stops the deploy.
      - run: npm run build
        env:
          CI: true

      # Photograph every place in the yard for the plain view, from this exact build, straight into it.
      # Adding or removing a project in src/data/profile.ts is enough: its photographs follow on deploy.
      # (The runner has no GPU, so Chrome renders with software WebGL; a few pages at once keeps it quick.)
      - name: Render plain-view photographs
        run: npm run stills -- --out=build/stills --jobs=3

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          commit_message: 'Deploy ${{ github.sha }}'
